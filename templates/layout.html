<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">\n
  <title>{% block title %}Calculadora IMC{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="unad-nav">
    <div class="nav-left">
      <img class="nav-logo" src="{{ url_for('static', filename='Logo_unad.png') }}" alt="Logo UNAD">
      <div class="nav-divider">
        <h1 class="nav-title">SISSU - UNAD</h1>
        <p class="nav-subtitle">Acción Solidaria Universitaria</p>
      </div>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Calculadora</a>
      <a href="/historial" class="nav-link {% if request.path == '/historial' %}active{% endif %}">Resultados</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="unad-footer">
    <p>&copy; 2026 Universidad Nacional Abierta y a Distancia - UNAD</p>
    <p>Sistema de Servicio Social Unadista</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
